# Reference for the EXISTING app: 9d0c16a6-acf2-42ac-96fe-27f3ab66dd40.
# Do not create a duplicate app. Preserve dashboard domains and environment.
# Secrets intentionally excluded; this is not a complete replacement export.
name: catalyst-innovations
region: nyc
services:
  - name: catalyst-innovations
    github:
      repo: DVass81/catalyst-innovations
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    envs:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mycatalystinnovations.com
        scope: RUN_AND_BUILD_TIME
