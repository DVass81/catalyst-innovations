# Reference for the SEPARATE REDESIGN COMPARISON app only.
# App ID: c56051c5-8ccb-4bb9-a9a1-e3288e1ba3d9
# The original domain remains on catalyst-innovations / main. Do not deploy this redesign there.
# This reference omits dashboard-managed settings and secrets.
name: catalyst-redesign-comparison
region: nyc
services:
  - name: catalyst-innovations
    github:
      repo: DVass81/catalyst-innovations
      branch: comparison/catalyst-redesign
      deploy_on_push: true
    build_command: npm ci --include=dev && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 8080
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: SITE_PREVIEW
        value: "true"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_SITE_URL
        value: ${APP_URL}
        scope: RUN_AND_BUILD_TIME
