name: Lighthouse CI

# Lighthouse scores are reported without score thresholds.
# Collection and upload errors still fail this workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/solutions
            http://localhost:3000/industries
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
