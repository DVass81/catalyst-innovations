name: Website quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/catalyst-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            test-report/
            test-results/
          retention-days: 7
